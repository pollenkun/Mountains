name: Bug report
description: Report reproducible behavior.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Node, Mountains commit, provider/model, and relevant settings. Do not include credentials.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal example. Redact credentials, personal paths, and private code.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
