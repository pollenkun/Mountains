limit_conn_zone $binary_remote_addr zone=mountains_per_ip:1m;
limit_conn_zone $server_name zone=mountains_total:1m;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name updates.cnsai.top;
    ssl_certificate /etc/letsencrypt/live/updates.cnsai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.cnsai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/mountains-updates;
    autoindex off;
    access_log /var/log/nginx/mountains-updates.access.log;
    error_log /var/log/nginx/mountains-updates.error.log;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { default_type text/plain; return 200 'ok\n'; }
    location ~ (^|/)\. { return 404; }
    location ~ \.part$ { return 404; }
    location /desktop/ {
        try_files $uri =404;
        limit_conn mountains_per_ip 2;
        limit_conn mountains_total 8;
        limit_rate_after 1m;
        limit_rate 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        location ~ \.(json|yml)$ {
            try_files $uri =404;
            add_header Cache-Control 'no-cache';
            add_header X-Content-Type-Options nosniff always;
        }
    }
    location / { return 404; }
}
